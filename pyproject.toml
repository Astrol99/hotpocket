[project]
name = "hotpocket"
version = "0.3.0"
description = "One Claude Code endpoint for a team, backed by a pool of Claude accounts"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["aiohttp>=3.9"]

[project.scripts]
hotpocket = "hotpocket:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-aiohttp>=1.1.1"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
