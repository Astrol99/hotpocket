# hotpocket and the Tailscale node it's reached through. Start or update (the prune deletes the replaced image):
#   docker compose up -d --build && docker image prune -f --filter label=com.docker.compose.project=hotpocket
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    environment:
      TS_HOSTNAME: hotpocket               # the machine name on your tailnet
      TS_AUTHKEY: ${TS_AUTHKEY:-}          # optional: without one, `docker compose logs tailscale` shows a login link
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /serve.json
    configs: [{source: serve, target: /serve.json}]
    volumes: [tailscale:/var/lib/tailscale, socket:/run/hotpocket]
    logging: {driver: local}               # rotates, like hotpocket's (Docker's default json-file never does)
    restart: unless-stopped
  hotpocket:
    build: .
    # No ports: its only way in is the socket it shares with Tailscale serve, which says who is asking.
    volumes: [data:/data, socket:/run/hotpocket]
    logging: {driver: local}               # rotates (a line per request adds up)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

configs:
  # HTTPS for everything; plain HTTP (http://hotpocket) only redirects to it. Serve also passes on the
  # admin grant from the tailnet policy (see the README). Compose doesn't notice an edit here: apply one
  # with `docker compose up -d --force-recreate tailscale`.
  serve:
    content: |
      {"TCP": {"443": {"HTTPS": true}, "80": {"HTTP": true}},
       "Web": {"$${TS_CERT_DOMAIN}:443": {"Handlers": {"/": {"Proxy": "unix:/run/hotpocket/hotpocket.sock",
                                                              "AcceptAppCaps": ["github.com/astrol99/hotpocket/admin"]}}},
               "$${TS_CERT_DOMAIN}:80": {"Handlers": {"/": {"Redirect": "https://$${TS_CERT_DOMAIN}/"}}}}}

volumes: {tailscale: {}, data: {}, socket: {}}
