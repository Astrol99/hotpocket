# Installed as /etc/systemd/system/claude-gateway.service.d/zzzz-hardening.conf.
# The incus Ubuntu image ships /run/systemd/system/service.d/zzz-lxc-service.conf,
# which sets NoNewPrivileges=no for every service. Drop-ins apply in filename
# order, so this one (zzzz-) runs after it and turns the setting back on.
[Service]
NoNewPrivileges=yes
