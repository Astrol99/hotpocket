# Installed as /etc/systemd/system/claude-gateway.service.d/zzzz-hardening.conf.
# The incus Ubuntu image ships /run/systemd/system/service.d/zzz-lxc-service.conf,
# which turns these settings off for every service. Drop-ins apply in filename
# order, so this one (zzzz-) runs after it and turns them back on.
[Service]
NoNewPrivileges=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
